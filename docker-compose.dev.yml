version: '3.8'

# Development override — hot reload via bind mounts
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: npx nodemon src/server.js
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/taskflow
      - JWT_SECRET=dev_access_secret
      - JWT_REFRESH_SECRET=dev_refresh_secret
      - CLIENT_URL=http://localhost:3000
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npx vite --host
    ports:
      - "3000:5173"
    environment:
      - VITE_API_URL=http://localhost:5001/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
